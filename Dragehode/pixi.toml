[workspace]
name = "effektovervaaking-dragehode"
description = "R + Quarto environment for the Dragehode report and analyses"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
r-base = "4.4.*"
quarto = "*"
# ecRxiv template (_common.R)
r-here = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-kableextra = "*"
r-yaml = "*"
r-tibble = "*"
r-conflicted = "*"
r-dplyr = ">=1.2"
r-rstudioapi = "*"
r-remotes = "*"
# data preparation (code/1a–3: Survey123 export, cleaning, merging)
r-tidyverse = "*"
r-readxl = "*"
r-openxlsx = "*"
r-sf = "*"
r-httr = "*"
r-jsonlite = "*"
"r-data.table" = "*"
# analyses (code/4–5 and the report)
r-vegan = "*"
r-car = "*"
r-ggrepel = "*"
r-ggpubr = "*"
r-reshape2 = "*"
r-lmertest = "*"
r-boot = "*"
r-rio = "*"
r-rstanarm = "*"
r-patchwork = "*"
r-glmmtmb = "*"
r-emmeans = "*"
r-ragg = "*"

[tasks]
# R packages that are only on GitHub (anybadger, used by _common.R) are installed into the pixi environment on first use
install-github-deps = "Rscript code/install_github_deps.R"
render = { cmd = "quarto render Dragehode.qmd", depends-on = ["install-github-deps"] }
