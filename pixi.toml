[workspace]
name = "effektovervaaking-website"
description = "Shared R + Quarto environment for the monitoring website"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
r-base = "4.4.*"
quarto = "*"
r-here = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-kableextra = "*"
r-yaml = "*"
r-tibble = "*"
r-conflicted = "*"
r-dplyr = ">=1.2"
r-remotes = "*"
r-tidyverse = "*"
r-glmmtmb = "*"
r-emmeans = "*"
r-patchwork = "*"
r-sf = ">=1.1_3,<2"
r-ggspatial = ">=1.1.11,<2"
r-magick = ">=2.9.1,<3"
r-ragg = ">=1.5.2,<2"
r-systemfonts = "*"
r-readxl = "*"
r-lmertest = "*"
r-vegan = "*"
r-gt = ">=1.4.0,<2"

[tasks]
install-report-deps = "Rscript scripts/install_report_dependencies.R"
render-site = { cmd = "quarto render", depends-on = ["install-report-deps"], env = { LANG = "C.UTF-8", LC_ALL = "C.UTF-8" } }

[target.linux-64.dependencies]
r-leaflet = ">=2.2.3,<3"
