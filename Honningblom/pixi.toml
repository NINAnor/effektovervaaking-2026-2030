[workspace]
name = "effektovervaaking-honningblom"
description = "R + Quarto environment for the Honningblom report and analyses"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
r-base = "4.4.*"
quarto = "*"
# ecRxiv template (_common.R)
r-here = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-kableextra = "*"
r-yaml = "*"
r-tibble = "*"
r-conflicted = "*"
r-dplyr = ">=1.2"
r-rstudioapi = "*"
r-remotes = "*"
# data preparation (code/1–4: Survey123 export, cleaning, merging, DwC)
r-tidyverse = "*"
r-readxl = "*"
r-openxlsx = "*"
r-writexl = "*"
r-sf = "*"
r-httr = "*"
r-jsonlite = "*"
r-curl = "*"
"r-data.table" = "*"
# analyses (code/5–6 and the report)
r-sciplot = "*"
r-boot = "*"
r-lme4 = "*"
r-vegan = "*"
r-rio = "*"
r-reshape2 = "*"
r-ragg = "*"

[tasks]
# R packages that are only on GitHub (anybadger, used by _common.R) are installed into the pixi environment on first use
install-github-deps = "Rscript code/install_github_deps.R"
render = { cmd = "quarto render Honningblom.qmd", depends-on = ["install-github-deps"] }
