name: Release Quarto book

run-name: Release book ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create for this release (for example, v2026.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: book-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must be run from main (got $GITHUB_REF)." >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || \
             ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install SVG conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin

      - name: Render HTML book
        run: quarto render --to html

      - name: Package HTML site
        id: html
        run: |
          test -f _site/index.html
          archive="$RUNNER_TEMP/effektovervaaking-book-html.zip"
          (cd _site && zip -q -r "$archive" .)
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Render PDF book
        run: quarto render --to pdf --output-dir _release-pdf

      - name: Prepare PDF asset
        id: pdf
        run: |
          pdf_path="$(find _release-pdf -type f -name '*.pdf' -print -quit)"
          if [[ -z "$pdf_path" ]]; then
            echo "Quarto did not produce a PDF." >&2
            exit 1
          fi

          asset="$RUNNER_TEMP/effektovervaaking-book.pdf"
          cp "$pdf_path" "$asset"
          echo "path=$asset" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PDF_ASSET: ${{ steps.pdf.outputs.path }}
          HTML_ASSET: ${{ steps.html.outputs.path }}
        run: >-
          gh release create "$RELEASE_TAG"
          "$PDF_ASSET" "$HTML_ASSET"
          --target "$GITHUB_SHA"
          --title "$RELEASE_TAG"
          --notes "Quarto book release $RELEASE_TAG."
