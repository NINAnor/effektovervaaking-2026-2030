project:
  type: book
  output-dir: _site
  execute-dir: file

book:
  title: "Effektovervåking 2026–2030"
  author: "NINA"
  description: >
    Code, cleaned data and yearly result summaries for NINA's monitoring of
    the effects of management actions for threatened species and habitat types
    in Norway.
  repo-url: https://github.com/NINAnor/effektovervaaking-2026-2030
  repo-branch: main
  chapters:
    - index.qmd
    - Dragehode/Dragehode.qmd
    - Honningblom/Honningblom.qmd
    - Elvesandjeger/Elvesandjeger.qmd
    - Stor-elvebreddedderkopp/Stor-elvebreddedderkopp.qmd
    - Tronderlav/Tronderlav.qmd
    - Askeglye/Askeglye.qmd
    - Rod-skogfrue/Rod-skogfrue.qmd
    - Trondertorvmose/Trondertorvmose.qmd
    - Svartkurle/Svartkurle.qmd
    - Kystlynghei/report/kystlynghei_condition_report.qmd
    - effektovervaking_forests/docs/forest_monitoring_report.qmd
  appendices:
    - Kystlynghei/report/kystlynghei_methods.qmd
    - effektovervaking_forests/docs/forest_monitoring_methods.qmd

format:
  html:
    filters:
      - scripts/lazy-images.lua
    theme:
      - cosmo
      - NINAstyle.scss
    toc: true
